<!-- STREAM MINI-WINDOW — deployed site-wide in the footer (W5, 2026-07-27).
     Static wayfinding only: no live/offline indicator here — real live
     status needs the Twitch API + an app access token, which can't be
     exposed in a static site (Phase 7 static/dynamic fork). Styles live in
     style.css (.stream-mini section). Pages outside the root (e.g. now/)
     get the link path via `root` front matter, same as nav-main. -->
<div class="stream-mini">
  <div class="sm-titlebar">Signal</div>
  <div class="sm-well">
    <div class="sm-testbar">
      <span class="sm-c1"></span><span class="sm-c2"></span><span class="sm-c3"></span><span class="sm-c4"></span><span class="sm-c5"></span>
    </div>
    <div class="sm-caption">twitch.tv/{{ stream.channel }}</div>
  </div>
  <a class="sm-link" href="{{ root }}streaming.html">&rarr; streaming</a>
</div>
