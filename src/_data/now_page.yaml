  - label: Reading
    title: Killed By A Traffic Engineer
    sub: Breaking down the traffic rules that shape how we interact with one another
    body: |-
      Killed by a Traffic Engineer is an interesting book. It is written in a very stochastic, broken up, sentence by sentence, matter-of-factly style that I interpreted as aggressive and condescending, which is quite apropos. You see, traffic laws in the USA are made to make driving as safe, easy, and efficient as possible for cars and trucks. Not people.

      In post-war America, as white americans left the cities for the suburbs, american infrastructure engineers (who were no doubt veterans who had also served in the grandest war reconstruction effort hitherto) designed roads like highways. Generalissimo presidente ike eisenhower signed the national highway act in 1956 and there had been commissions who studied roads to see what would be the best way to build america's brand new autobahn - i mean interstate system. traffic engineers who were funded by oil moguls produced reports telling the federal government that highways were the bestest and most safest way to get people from point A to point B, if that meant it would take them directly from their driveways to their jobs. and shopping malls, sometimes. 
      you see, in the post war era, americans had this intense fervor for white picketed single-family homes to escape the squalor and must of the cities. people didnt want to ride streetcars anymore, they wanted to listen to the radio and smoke in their own cars and by gods name is it our american right to sit in traffic and smoke a cigarette and eat a hamburger. 

      so at some point, it was true that highways (limited entrances, no stops, high speeds, straight and flat high speed roads) took the most people the farthest distances with no crashes.

      because highways are long and don't really have anything, traffic is quite safe

      except, that they wanted to design ALL roads to be like this,,,,


      and thats why so many suburban roads feel like highways, yet try to be local streets. thats how we end up with 8 lane abominations with a median and no bike lanes all to connect chick fil a to the starbucks and highway entrance. and why is there always so much traffic?

      dammit, now im writing like the author....
