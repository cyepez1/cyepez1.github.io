  - category: Essay
    title: Neighboring
    month_long: July 4 2026
    month_short: JUL26
    words_long: '200'
    words_short: '200'
    date: 2026-07-27
    excerpt: |-
      Today after the storm, my neighbor let me know he picked up the branches from my tree and tossed them into the street. He started talking to my mom for like twenty minutes, then the neighbor to his right. I think they talk a bit, but I've never spoken to her. 

      Little interactions like this made me think about how easy or natural it is to be neighborly. After a storm, it felt right to just put all of the branches on the street -- even if you don't have any trees. On the other hand, my other neighbor doesn't talk to me too much either, and hates that our tree drops tree-things onto their yard. I helped out and tried to clean up the leaves on their side with the air blower, but saw they were watching and didn't want them to think I was blowing leaves onto their lawn. They already think I do that.

      How easy is it to be neighborly? What if your neighbors just really suck? It's ok to be an annoyingly friendly neighbor if your neighbors really suck, by the way.
  - category: Notes
    title: Moving Archer Forward?
    month_long: June 2026
    month_short: June 2026
    words_long: '200'
    words_short: '200'
    date: 2026-06-24
    excerpt: |-
      Moving Archer Forward is a plan to strengthen and invest into the Archer Avenue corridor from Halsted to Cicero. It is a controversial plan because it aims to bring revitalization to disinvested areas, infill lots with affordable housing, improve transit options and stations, increase green space, and -- quite possibly the most controversial -- integrate bike-related infrastructure into the street network.

      The City of Chicago commissioned a study into the corridor several years ago and this was their proposal. The study was done because the Southwest Side, in comparison to other developing areas of the city, lacks:
      - Business Investment
      - Community Investment
      - Affordable housing
      - Equitable transit oriented development
      - Transit infrastructure
      - Cohesive transportation network

      Each of these bullet points deserves its own story on how disinvestment has been a tool of the Chicago Political Machine. Each bullet point is also weaponized by conservatives in neighborhoods who hate seeing construction and new people in their neighborhood.
